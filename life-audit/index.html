<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Audit</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b1d4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Audit">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday and private: calm, warm, unhurried
   IDEA a pocket field notebook that grows into a research dossier
   PICTURE the live question card and capture page, plus a seven-segment ring of what is known
   COLOUR white or night ground, deep plum band and ink, lilac panels, coral for the one action
   TYPE Newsreader for questions, titles and your own words; Figtree for interface
   LAYOUT phone: band, content, bottom tabs, capture button; desktop: left rail and a reading column */
:root{--bg:#ffffff;--ink:#1d1722;--mute:#655d6c;--brand:#3b1d4b;--bandBg:#3b1d4b;--bandInk:#f7f0fb;--bandMute:#d5c4e0;--panel:#f6f1f9;--panel2:#e9e0f0;--line:#e3dbe9;--acc:#d3432a;--accInk:#ffffff;--good:#2c6a4a;--shadow:0 10px 30px rgba(40,10,50,.14);--serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#131016;--ink:#eee8f2;--mute:#a79eae;--brand:#dcc6ea;--bandBg:#2a1838;--bandInk:#f4ecf8;--bandMute:#bda9ca;--panel:#1d1823;--panel2:#2a2231;--line:#352c3c;--acc:#ff7a5a;--accInk:#1c0d08;--good:#88d0a8;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme=dark]{--bg:#131016;--ink:#eee8f2;--mute:#a79eae;--brand:#dcc6ea;--bandBg:#2a1838;--bandInk:#f4ecf8;--bandMute:#bda9ca;--panel:#1d1823;--panel2:#2a2231;--line:#352c3c;--acc:#ff7a5a;--accInk:#1c0d08;--good:#88d0a8;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);overflow-x:clip;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
#main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));outline:none}
.wrap{width:100%;max-width:860px;margin-inline:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media(min-width:600px){.wrap{padding-left:32px;padding-right:32px}}
.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.enter{animation:none}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .brand{display:none}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:6px 1px;color:var(--mute);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:-.01em}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current=page]{color:var(--brand)}
.tabs a[aria-current=page] svg{stroke-width:2.4}
@media(min-width:900px){.app{display:grid;grid-template-columns:232px minmax(0,1fr)}.tabs{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:2px;border-top:0;border-right:1px solid var(--line);padding:28px 14px}.tabs .brand{display:block;font:600 22px/1.1 var(--serif);padding:0 14px 22px;color:var(--brand)}.tabs a{flex-direction:row;justify-content:flex-start;gap:12px;min-height:46px;padding:0 14px;border-radius:12px;font-size:15px}.tabs a[aria-current=page]{background:var(--panel)}#main{padding-bottom:64px}.fab{bottom:32px!important;right:32px!important}#toast{bottom:40px!important}}
.band{background:var(--bandBg);color:var(--bandInk);padding:calc(18px + env(safe-area-inset-top,0px)) 0 30px}
.bandtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.mark{font:600 19px/1 var(--serif);white-space:nowrap}
@media(max-width:480px){.band .sync{display:none}}
.title{font:500 clamp(32px,7vw,46px)/1.05 var(--serif);letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
.lede{color:var(--mute);margin:0 0 8px;max-width:60ch}
.band .lede,.band .flabel,.band .sync{color:var(--bandMute)}
.projects{display:grid;gap:12px;margin:20px 0 6px}
@media(min-width:600px){.projects{grid-template-columns:1fr 1fr;gap:24px}}
.projects div{border-top:1px solid color-mix(in srgb,var(--bandInk) 28%,transparent);padding-top:10px}
.projects b{display:block;font-weight:600}
.projects span{color:var(--bandMute);font-size:15px}
.band input[type=text]{background:color-mix(in srgb,var(--bandInk) 10%,transparent);border-color:color-mix(in srgb,var(--bandInk) 28%,transparent);color:var(--bandInk)}
.band input::placeholder{color:var(--bandMute)}
.btn.onband{background:transparent;color:var(--bandInk);border-color:color-mix(in srgb,var(--bandInk) 38%,transparent)}
.head{padding:calc(24px + env(safe-area-inset-top,0px)) 0 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head .title{margin-bottom:8px}
.head>div{flex:1 1 auto}
.head .sync,.flowtop .sync{flex:none}
.sync{font-size:13px;color:var(--mute);white-space:nowrap;padding-top:8px}
.h2{font:600 22px/1.2 var(--serif);margin:32px 0 12px;letter-spacing:-.01em}
.h3{font-weight:700;font-size:16px;margin:22px 0 8px}
.flabel{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:16px 0 6px}
.muted{color:var(--mute)}
.mini{font-size:13px;color:var(--mute);margin:0 0 4px}
textarea,input[type=text],input[type=number],input[type=search]{width:100%;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.55}
textarea{resize:vertical;min-height:96px;display:block}
textarea:focus,input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
textarea:disabled,input:disabled{opacity:.6}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.writer{min-height:38vh;font:18px/1.6 var(--serif);border-radius:18px;padding:16px 18px;background:var(--panel);border-color:transparent;resize:none}
.writer.sm{min-height:150px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:15px;line-height:1.2;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btn.mic[aria-pressed=true]{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:15px;line-height:1.3;text-align:left;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--bg)}
.chip.sm{min-height:40px;padding:6px 13px;font-size:14px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale .chip{text-align:center;font-weight:700;font-size:18px;padding:0;min-height:52px;border-radius:14px}
.scalelab{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:6px;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.flowtop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:calc(12px + env(safe-area-inset-top,0px));margin-left:-14px}
.dimname{font-size:14px;font-weight:600;color:var(--brand);margin:18px 0 0}
.ptag{color:var(--mute);font-weight:500}
.qtext{font:500 clamp(25px,5.6vw,34px)/1.16 var(--serif);letter-spacing:-.015em;margin:10px 0;text-wrap:balance}
.qtext.sm{font-size:24px}
.hint{color:var(--mute);margin:0 0 14px}
.ans{margin-top:18px}
.numrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.numrow input{max-width:220px;font-size:22px;font-weight:600}
.numrow span{color:var(--mute)}
.savestate{font-size:13px;color:var(--mute);min-height:20px;margin-top:8px}
.flownav{display:grid;grid-template-columns:auto auto auto minmax(0,1fr);gap:8px;margin-top:20px;align-items:center}
.flownav .pri{justify-self:end;min-width:120px}
@media(max-width:480px){.flownav{grid-template-columns:repeat(3,minmax(0,1fr))}.flownav .pri{grid-column:1/-1;order:-1;justify-self:stretch}.flownav .btn{white-space:normal;padding-inline:8px}}
.extras{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.addenda div{border-left:3px solid var(--panel2);padding:4px 0 4px 12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.partial{color:var(--mute);font-style:italic;font-size:15px;margin-top:6px}
.partial:empty{display:none}
.dims{list-style:none;padding:0;margin:10px 0 0}
.dimrow{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:16px 0;cursor:pointer;color:var(--ink)}
.dl{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font:600 20px/1 var(--serif);background:var(--panel);color:var(--brand)}
.dl.pa{background:color-mix(in srgb,var(--acc) 15%,var(--bg));color:var(--acc)}
.dimrow b{display:block;font-size:17px}
.dimrow small{display:block;color:var(--mute);font-size:14px;line-height:1.4;margin-top:2px}
.cnt{font-size:14px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.review{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer;color:var(--ink)}
.rq{display:block;font-weight:600}
.ra{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--mute);white-space:pre-wrap}
.grid2{display:grid;gap:0 44px}
@media(min-width:900px){.grid2{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.cont{background:var(--panel);border-radius:18px;padding:18px 20px}
.qprev{font:500 22px/1.25 var(--serif);margin:6px 0 14px}
.mapwrap{display:grid;grid-template-columns:128px minmax(0,1fr);gap:18px;align-items:center}
.ring{width:128px;height:128px;display:block}
.ringn{font:600 26px var(--serif);fill:var(--ink)}
.ringl{font:500 13px var(--sans);fill:var(--mute)}
.maplist{list-style:none;margin:0;padding:0}
.maplist button{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0;min-height:40px;cursor:pointer;color:var(--ink);text-align:left;font-size:15px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.outs{list-style:none;margin:0;padding:0}
.outs li{padding:10px 0;border-top:1px solid var(--line)}
.banner{background:var(--panel);border-radius:14px;padding:12px 16px;margin:18px 0 0;font-size:15px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tagsug{margin-top:10px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin-top:10px}
.filters .chip{flex:none}
.day{font-size:14px;font-weight:700;color:var(--mute);margin:26px 0 4px}
.entry{border-top:1px solid var(--line);padding:14px 0 8px}
.when{font-size:13px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 4px;font:17px/1.6 var(--serif)}
.clamp{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.ttag{font-size:13px;color:var(--brand);background:var(--panel);border-radius:999px;padding:1px 9px}
.acts{display:flex;gap:2px;margin-left:-14px}
details.orig{font-size:14px;color:var(--mute);margin-top:6px}
details.orig summary{cursor:pointer;min-height:32px}
details.orig div{white-space:pre-wrap;padding:8px 12px;border-left:3px solid var(--panel2);overflow-wrap:anywhere}
.empty{color:var(--mute);padding:18px 0}
.aip{background:var(--panel);border-radius:18px;padding:18px 20px;margin-top:12px}
.aip p{margin:0 0 8px}
.prog{font-size:14px;color:var(--mute);margin:10px 0 0}
.summary{font:400 21px/1.45 var(--serif);margin:14px 0 6px}
.care{border-left:3px solid var(--acc);padding:6px 0 6px 14px;margin:14px 0}
.ins{border-top:1px solid var(--line);padding:16px 0}
.ins h4{font-size:17px;margin:0 0 6px;font-weight:700}
.ins p{margin:0 0 8px}
.ins .alt{color:var(--mute);font-size:15px}
.ins.dis h4{color:var(--mute);font-weight:500;text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.tag{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.tag.b-fact{color:var(--good)}
.tag.b-hypothesis{color:var(--acc)}
.ref{display:inline-flex;align-items:center;font-size:13px;min-height:36px;padding:4px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--brand);cursor:pointer;white-space:nowrap;vertical-align:middle;margin:2px 0}
.fb{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fb .chip{min-height:40px;padding:6px 13px;font-size:14px}
.ins textarea{margin-top:10px;min-height:70px}
.hist{list-style:none;padding:0;margin:0}
.hist button{display:flex;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;min-height:48px;cursor:pointer;color:var(--ink);text-align:left}
.hist button[aria-current=true]{font-weight:700}
.sec{border-top:1px solid var(--line);padding:18px 0}
.sec h3{font:600 21px/1.25 var(--serif);margin:0 0 8px}
.sec ul,.changes ul,.draft ul{padding-left:20px;margin:6px 0}
.sec li,.changes li{margin:6px 0}
.sec p,.draft p{margin:0 0 8px}
.changes{background:var(--panel);border-radius:18px;padding:16px 20px;margin:14px 0}
.note{border-left:3px solid var(--acc);padding:4px 0 4px 12px;margin:10px 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.optrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.optmain{background:none;border:0;text-align:left;cursor:pointer;padding:4px 0;color:var(--ink);min-height:44px}
.optmain b{display:block;font-size:17px}
.optmain small{color:var(--mute);font-size:14px}
.draft{background:var(--panel);border-radius:14px;padding:12px 14px;margin:8px 0 4px;font-size:15px}
.critlist{list-style:none;padding:0;margin:0}
.critlist li{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:4px 0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:15px}
table.cmp th,table.cmp td{vertical-align:top;text-align:left;padding:10px;border-top:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
table.cmp th[scope=row]{width:150px;color:var(--mute);font-weight:600;font-size:14px}
table.cmp thead th{font:600 17px/1.2 var(--serif);border-top:0}
@media(max-width:600px){table.cmp{min-width:0}table.cmp thead{display:none}table.cmp tr{display:block;padding:12px 0;border-top:1px solid var(--line)}table.cmp th[scope=row]{display:block;width:auto;border:0;padding:0 0 6px;font-size:15px;color:var(--ink);font-weight:700}table.cmp td{display:block;border:0;padding:4px 0 6px}table.cmp td::before{content:attr(data-l);display:block;font-size:13px;font-weight:600;color:var(--brand)}}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:35;width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:var(--accInk);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}
.fab[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(12,6,16,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheet p{margin:0 0 12px}
@media(min-width:700px){#sheet{align-items:center}.sheet{border-radius:22px;padding:28px}}
.quote{white-space:pre-wrap;font:17px/1.6 var(--serif);background:var(--panel);border-radius:14px;padding:14px 16px;overflow-wrap:anywhere;margin:10px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
<nav class="tabs" aria-label="Sections">
<div class="brand">Life audit</div>
<a href="#home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
<a href="#discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6V14M12 17.5v.01"/></svg><span>Discover</span></a>
<a href="#thoughts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span>Thoughts</span></a>
<a href="#insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>Insights</span></a>
<a href="#dossier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg><span>Dossier</span></a>
<a href="#decide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-7M12 14L6 8M12 14l6-6M6 8V4M6 4H2M18 8V4m0 0h4"/></svg><span>Decide</span></a>
</nav>

function readLocal(){try{const j=JSON.parse(localStorage.getItem(LKEY)||'null');return j&&typeof j==='object'?j:null}catch(e){return null}}

async function write(col,id,attempt){const d=S[col][id];const ref=base.collection(col).doc(id);try{if(d===undefined)await ref.delete();else await ref.set(clone(d))}catch(e){const c=e&&e.code;if(c==='unavailable'&&!attempt){await sleep(700+Math.random()*900);return write(col,id,1)}if(c==='quota_exceeded')toast('Storage is full. Export, then delete old entries.');else if(c==='invalid_argument')toast('Could not save this entry: '+((e&&e.message)||'it was refused'));else if(c==='revoked'){syncState='revoked';status()}else toast('Not saved yet. Check your connection.')}}

function qsFor(d){const out=Q.filter(x=>x.d===d);const cus=Object.values(S.custom).filter(c=>c&&c.d===d).sort((a,b)=>byC(b,a));for(const c of cus){const it={id:c.id,d,t:'long',q:c.q,ai:1};const i=out.findIndex(o=>o.id===c.after);out.splice(i<0?out.length:i+1,0,it)}return out.filter(visible)}

function stats(d){const qs=qsFor(d);let done=0;for(const x of qs)if(isDone(S.answers[x.id]))done++;return{n:qs.length,done}}
function firstOpenIdx(d){const qs=qsFor(d);let i=qs.findIndex(x=>{const a=S.answers[x.id];return !isDone(a)&&!(a&&a.status==='skipped')});if(i<0)i=qs.findIndex(x=>!isDone(S.answers[x.id]));return i<0?qs.length:i}

const refChip=r=>typeof r==='string'&&/^[AT]:[A-Za-z0-9_-]+$/.test(r)&&refExists(r)?`<button class="ref" data-act="ref" data-ref="${esc(r)}">${esc(refLabel(r))}</button>`:'';
function refify(h){return h.replace(/\[([AT]:[A-Za-z0-9_-]+)\]/g,(m,r)=>refChip(r))}
function rich(t){const lines=String(t||'').split(/\n+/);let h='',ul=false;for(let l of lines){l=l.trim();if(!l)continue;const li=/^[-•*]\s+/.test(l);const body=refify(esc(l.replace(/^[-•*]\s+/,'')));if(li){if(!ul){h+='<ul>';ul=true}h+=`<li>${body}</li>`}else{if(ul){h+='</ul>';ul=false}h+=`<p>${body}</p>`}}if(ul)h+='</ul>';return h}
function counts(){let na=0;for(const d of DIMS)for(const x of qsFor(d.id))if(isDone(S.answers[x.id]))na++;return{na,nt:Object.keys(S.thoughts).length}}
function corpus(limit=140000){const head=[];let na=0;for(const d of DIMS){const L=[];for(const x of qsFor(d.id)){const a=S.answers[x.id];if(!isDone(a))continue;na++;let s=`[A:${x.id}] Q: ${x.q}\nA: ${ansText(x,a)}`;if(a.addenda&&a.addenda.length)s+='\n'+a.addenda.map(z=>`Added ${String(z.at).slice(0,10)}: ${z.text}`).join('\n');L.push(s)}if(L.length)head.push(`## ${d.name} (Project ${d.proj})\n\n${L.join('\n\n')}`)}
const th=Object.values(S.thoughts).filter(Boolean).sort(byC);const parts=th.map(t=>`[T:${t.id}] ${String(t.created).slice(0,16).replace('T',' ')}${t.tags&&t.tags.length?' | tags: '+t.tags.join(', '):''}\n${t.text}`);const ans=head.join('\n\n');let omitted=0,total=ans.length+parts.reduce((s,p)=>s+p.length+2,0);while(total>limit&&parts.length){total-=parts[0].length+2;parts.shift();omitted++}
const crit=critList();return{text:`# Guided interview\n\n${ans||'(no answers yet)'}\n\n# Thought dumps, oldest first${omitted?` (${omitted} oldest omitted for length)`:''}\n\n${parts.join('\n\n')||'(none yet)'}${crit.length?`\n\n# His decision criteria\n${crit.map(c=>'- '+c).join('\n')}`:''}`,na,nt:parts.length,omitted,count:na+th.length}}

function topTags(){const m={};for(const t of Object.values(S.thoughts))for(const g of (t&&t.tags)||[])m[g]=(m[g]||0)+1;return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10).map(e=>e[0])}
function localCount(){if(!localCache)return 0;let n=0;for(const c of COLS)n+=Object.keys(localCache[c]||{}).length;return n}
function ring(){const R=54,C=2*Math.PI*R,seg=C/7,len=seg-5;let s='',tot=0,dn=0;DIMS.forEach((d,i)=>{const st=stats(d.id);tot+=st.n;dn+=st.done;const f=st.n?st.done/st.n:0;const off=(-i*seg).toFixed(2);s+=`<circle cx="70" cy="70" r="${R}" fill="none" style="stroke:var(--panel2)" stroke-width="13" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${off}"/>`;if(f>0){const l=len*f;s+=`<circle cx="70" cy="70" r="${R}" fill="none" style="stroke:${d.proj==='A'?'var(--acc)':'var(--brand)'}" stroke-width="13" stroke-dasharray="${l.toFixed(2)} ${(C-l).toFixed(2)}" stroke-dashoffset="${off}"/>`}});const p=tot?Math.round(dn/tot*100):0;return `<svg class="ring" viewBox="0 0 140 140" role="img" aria-label="${p} percent of questions have a response"><g transform="rotate(-90 70 70)">${s}</g><text x="70" y="74" text-anchor="middle" class="ringn">${p}%</text><text x="70" y="94" text-anchor="middle" class="ringl">explored</text></svg>`}

try{const res=await ask(p,'complex',progFn('Writing the synthesis'));const sec={};const rs=(res&&res.sections)||{};for(const [k] of SECTIONS)sec[k]=str(rs[k]).slice(0,6000);if(!Object.values(sec).some(Boolean))throw{message:'The synthesis came back empty.'};const changes=(Array.isArray(res.changes)?res.changes:[]).map(ch=>ch&&typeof ch==='object'?{section:SECL[ch.section]?ch.section:'current',what:str(ch.what).slice(0,600),why:str(ch.why).slice(0,600),refs:(Array.isArray(ch.refs)?ch.refs:[]).filter(r=>typeof r==='string'&&/^[AT]:[A-Za-z0-9_-]+$/.test(r)&&refExists(r)).slice(0,6)}:null).filter(ch=>ch&&ch.what).slice(0,30);const id=nid('s');put('synth',id,{id,n:(prev?prev.n:0)+1,created:now(),sections:sec,changes,basis:{answers:c.na,thoughts:c.nt,run:run?run.id:null}},{quiet:true});U.synthV=null;toast('Synthesis updated')}catch(e){aiErr(e,'synth')}finally{U.busy=null;render()}}
async function aiOption(id){if(U.busy)return;const b=OPTIONS.find(o=>o.id===id);const c=corpus();if(!c.count){toast('Answer a question or save a thought first.');return}U.busy={kind:'opt'};U.prog='Reading your record';U.aiMsg='';render();
const p=`${FRAME}\n\n${RULES}\n\nDraft a structured assessment of ONE possible path, using only his record. This is a draft for him to edit, not a recommendation.\n\nPath: ${b.name}. ${b.desc}\n\nFor each field write 2 to 5 short lines beginning with "- ", citing ids in square brackets such as [A:b4]. Where the record lacks what is needed, write "- Unknown:" and name exactly what to find out. In "next", include administrative checks where relevant: financial aid repayment, scholarship conditions, academic standing and satisfactory academic progress, leave-of-absence policy, housing and lease obligations, and visa or enrollment-status rules if the record suggests they apply.\n\nReturn only JSON in exactly this shape:\n{"fields":{"fin":"financial implications","acad":"academic consequences","opp":"opportunity costs","long":"long-term potential","pers":"personal and emotional implications","risk":"risks and uncertainties","ev":"evidence that would make this path more or less attractive","next":"required next steps"},"unknowns":["the most important open facts for this path"]}\n\nTHE RECORD\n${c.text}`;
try{const res=await ask(p,'complex',progFn('Drafting'));const f={};const rf=(res&&res.fields)||{};for(const [k] of FIELDS)f[k]=str(rf[k]).slice(0,3000);if(!Object.values(f).some(Boolean))throw{message:'The draft came back empty.'};setOpt(id,{ai:{fields:f,unknowns:(Array.isArray(res.unknowns)?res.unknowns:[]).map(str).filter(Boolean).slice(0,10),at:now()}},{quiet:true});toast('Draft ready')}catch(e){aiErr(e,'opt')}finally{U.busy=null;render()}}
async function aiFollowup(){const x=curQ();if(!x)return;const a=S.answers[x.id];if(!isDone(a)||U.busy||!sample)return;const d=dimById(x.d);const ctx=qsFor(x.d).filter(z=>isDone(S.answers[z.id])).map(z=>`Q: ${z.q}\nA: ${ansText(z,S.answers[z.id])}`).join('\n\n');U.busy={kind:'follow'};render();
try{const res=await ask(`${FRAME}\n\nYou are interviewing him about one dimension: ${d.name}. Every question already asked in this dimension, with his answers:\n\n${ctx}\n\nHe just answered:\nQ: ${x.q}\nA: ${ansText(x,a)}\n\nWrite ONE follow-up question that would surface something important he has not said yet: a root cause, a contradiction, a concrete detail, or the line between fact and interpretation. Do not repeat or rephrase a question already asked. Under 30 words. Plain, warm and direct. Never use em dashes.\nReturn only JSON: {"question":"..."}`,'default');const t=str(res&&res.question);if(!t)throw{message:'No question came back.'};const id=nid('x');put('custom',id,{id,d:x.d,after:x.id,q:t.slice(0,300),created:now()},{quiet:true});toast('Follow-up added as the next question')}catch(e){aiErr(e,'follow')}finally{U.busy=null;render()}}
function toMD(){const L=['# Life audit export','',`Exported ${new Date().toLocaleString()}`,''];L.push('## Guided discovery','');for(const d of DIMS){const qs=qsFor(d.id).filter(x=>S.answers[x.id]&&S.answers[x.id].status&&S.answers[x.id].status!=='open');if(!qs.length)continue;L.push(`### ${d.name} (Project ${d.proj})`,'');for(const x of qs){const a=S.answers[x.id];L.push(`**${x.q}**`,'',ansText(x,a)||'(empty)','');for(const z of a.addenda||[])L.push(`> Added ${String(z.at).slice(0,10)}: ${z.text}`,'')}}
const th=Object.values(S.thoughts).filter(Boolean).sort(byC);if(th.length){L.push('## Thoughts','');for(const t of th){L.push(`### ${fDate(t.created)}${t.tags&&t.tags.length?' · '+t.tags.join(', '):''}`,'',t.text,'');if(t.original)L.push('Original version:','',t.original.split('\n').map(l=>'> '+l).join('\n'),'')}}
const sy=latestSynth();if(sy){L.push(`## Synthesis, version ${sy.n} (${fDate(sy.created)})`,'');for(const [k,l] of SECTIONS)L.push(`### ${l}`,'',sy.sections[k]||'(empty)','');const all=synthSorted();if(all.length){L.push('### Change history','');for(const v of all){L.push(`Version ${v.n}, ${fDate(v.created)}:`);for(const ch of v.changes||[])L.push(`- ${SECL[ch.section]||ch.section}: ${ch.what}${ch.why?' ('+ch.why+')':''}`);L.push('')}}}
const runs=runsSorted();if(runs.length){L.push('## Analyses','');for(const r of runs){L.push(`### ${fDate(r.created)}`,'',r.summary||'','');for(const it of r.items||[])L.push(`- **${it.title}** (${it.kind.replace('_',' ')}; ${BASIS[it.basis]}; ${it.confidence} confidence): ${it.detail}${it.alternative?' Alternative: '+it.alternative:''}${it.fb&&it.fb.v?` [Your response: ${it.fb.v}${it.fb.note?', '+it.fb.note:''}]`:''}`);if((r.questions||[]).length){L.push('','Questions:');for(const x of r.questions)L.push('- '+x)}L.push('')}}
L.push('## Decisions','');const cr=critList();if(cr.length){L.push('Criteria:');for(const c of cr)L.push('- '+c);L.push('')}for(const o of OPTIONS){const r=optRec(o.id);L.push(`### ${o.name}`,'',`Status: ${STAT[r.status]||'Exploring'}. Timing: ${URG[r.urgency||'']}. Reversibility: ${r.reversibility?r.reversibility+' of 5':'not rated'}.`,'');for(const [k,l] of FIELDS)if(str(r.fields[k]))L.push(`**${l}.** ${r.fields[k]}`,'')}
return L.join('\n')}

if(OFFLINE){const type=name.endsWith('.json')?'application/json':'text/markdown';try{const f=new File([text],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}try{const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return}catch(e){}}copySheet(name,text)}
const stamp=v=>String((v&&(v.updated||v.created))||'');
const tombs=()=>((S.meta.tombs&&S.meta.tombs.items)||{});
function tomb(key){put('meta','tombs',{items:{...tombs(),[key]:now()},updated:now()},{quiet:true})}
function mergeMeta(id,v,e){if(!e)return v;if(id==='tombs'){const items={...(e.items||{})};for(const [k,t] of Object.entries(v.items||{}))if(!items[k]||t>items[k])items[k]=t;return{items,updated:now()}}
if(id==='synthNotes'){const notes={};const keys=new Set([...Object.keys(e.notes||{}),...Object.keys(v.notes||{})]);for(const k of keys){const seen=new Set(),arr=[];for(const x of [...((e.notes||{})[k]||[]),...((v.notes||{})[k]||[])]){const sig=x.at+'|'+x.text;if(!seen.has(sig)){seen.add(sig);arr.push(x)}}notes[k]=arr.sort((a,b)=>String(a.at).localeCompare(String(b.at)))}return{notes,updated:now()}}
if(id==='criteria'){const tb={...tombs(),...((S.meta.tombs&&S.meta.tombs.items)||{})};const map=new Map();for(const c of [...(e.items||[]),...(v.items||[])])if(c&&c.id&&!tb['crit/'+c.id])map.set(c.id,c);return{items:[...map.values()],updated:now()}}
return stamp(v)>stamp(e)?v:e}
async function mergeData(data){let n=0;const inT=(data&&data.meta&&data.meta.tombs&&data.meta.tombs.items)||{};
if(data&&data.meta&&data.meta.tombs){const m=mergeMeta('tombs',data.meta.tombs,S.meta.tombs);put('meta','tombs',m,{quiet:true})}
const tb=tombs();
for(const c of COLS){const o=(data&&data[c])||{};for(const id of Object.keys(o)){if(!/^[A-Za-z0-9_.~:@+-]{1,120}$/.test(id)||id==='.'||id==='..'||(c==='meta'&&id==='tombs'))continue;const v=o[id];if(!v||typeof v!=='object'||Array.isArray(v))continue;if(tb[c+'/'+id]&&tb[c+'/'+id]>=stamp(v))continue;const e=S[c][id];let next;if(c==='meta')next=mergeMeta(id,v,e);else next=!e||stamp(v)>stamp(e)?v:null;if(!next||JSON.stringify(next)===JSON.stringify(e))continue;put(c,id,next,{quiet:true});n++;if(mode==='cloud')await sleep(120)}}
for(const [k,t] of Object.entries(inT)){const i=k.indexOf('/');const c=k.slice(0,i),id=k.slice(i+1);if(!COLS.includes(c))continue;const e=S[c][id];if(e&&stamp(e)<=t){put(c,id,undefined,{quiet:true});n++;if(mode==='cloud')await sleep(120)}}
render();return n}

const H=window.claude&&window.claude.hot;if(H&&typeof H.ready==='function')H.ready(start);else start((H&&H.data)||{});
}
